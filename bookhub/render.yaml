services:
  - type: web
    name: bookhub-backend
    runtime: go
    plan: free
    region: singapore
    rootDir: bookhub
    buildCommand: go build -o bookhub .
    startCommand: ./bookhub
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
